<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Personal Operations Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #09090b;
                color: #f4f4f5;
            }
            .card {
                background: #18181b !important;
                border-color: #27272a !important;
            }
            .muted {
                color: #a1a1aa !important;
            }
        }
        .card {
            max-width: 28rem;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            border-radius: 0.75rem;
            background: rgba(79, 70, 229, 0.12);
            color: #4f46e5;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
        }
        p {
            margin: 0 0 1.5rem;
            font-size: 0.875rem;
            line-height: 1.5;
            color: #475569;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 0.5rem;
            background: #4f46e5;
            color: #ffffff;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">OH</div>
        <h1>Local Server Unreachable</h1>
        <p class="muted">
            Personal Operations Hub cannot connect to your local Laravel server right now.
            Make sure <code>scripts\start-background.ps1</code> or <code>start.bat</code> is running on this Windows machine.
        </p>
        <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
