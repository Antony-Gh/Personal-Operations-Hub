services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-operations-hub:latest
    container_name: poh_app
    restart: unless-stopped
    environment:
      - APP_NAME=Personal Operations Hub
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=database
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-false}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      - poh_database:/var/www/html/database
      - poh_backups:/var/www/html/storage/app/backups
      - poh_logs:/var/www/html/storage/logs
      - poh_storage:/var/www/html/storage/app/public
    networks:
      - poh_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue:
    image: personal-operations-hub:latest
    container_name: poh_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60", "--no-interaction"]
    environment:
      - APP_NAME=Personal Operations Hub
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - RUN_MIGRATIONS=false
    volumes:
      - poh_database:/var/www/html/database
      - poh_logs:/var/www/html/storage/logs
    networks:
      - poh_internal
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: personal-operations-hub:latest
    container_name: poh_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    environment:
      - APP_NAME=Personal Operations Hub
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - RUN_MIGRATIONS=false
    volumes:
      - poh_database:/var/www/html/database
      - poh_backups:/var/www/html/storage/app/backups
      - poh_logs:/var/www/html/storage/logs
    networks:
      - poh_internal
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: poh_caddy
    restart: unless-stopped
    ports:
      - "${POH_HTTP_PORT:-80}:80"
      - "${POH_HTTPS_PORT:-443}:443"
    environment:
      - POH_DOMAIN=${POH_DOMAIN:-:80}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - poh_internal
    depends_on:
      app:
        condition: service_healthy

networks:
  poh_internal:
    name: poh_internal

volumes:
  poh_database:
    name: poh_database
  poh_backups:
    name: poh_backups
  poh_logs:
    name: poh_logs
  poh_storage:
    name: poh_storage
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
