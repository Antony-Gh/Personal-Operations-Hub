<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
    <style>
        .poh-bg { fill: #4F46E5; }
        @media (prefers-color-scheme: dark) {
            .poh-bg { fill: #6366F1; }
        }
    </style>
    <!-- Rounded Container -->
    <rect class="poh-bg" x="0" y="0" width="40" height="40" rx="10" />
    
    <!-- Central Node -->
    <circle cx="20" cy="20" r="5" fill="#FFFFFF" />
    
    <!-- Satellite Nodes -->
    <circle cx="20" cy="10" r="2.5" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="20" cy="30" r="2.5" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="10" cy="20" r="2.5" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="30" cy="20" r="2.5" fill="#FFFFFF" fill-opacity="0.9" />
    
    <!-- Connecting Operational Vectors -->
    <path
        d="M20 12.5V15M20 25V27.5M12.5 20H15M25 20H27.5"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"
        stroke-opacity="0.95"
    />
</svg>

